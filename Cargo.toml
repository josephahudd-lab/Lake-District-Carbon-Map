[package]
name = "carbon_lidar"
version = "0.1.0"
edition = "2021"

[dependencies]
las = { version = "0.9", features = ["laz", "laz-parallel"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
rustc-hash = "2.0"
csv = "1.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
