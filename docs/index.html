<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake District Carbon Map - 862,000 Vector Squares</title>
  
  <!-- MapLibre GL JS & PMTiles v3 -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; }
    #map { height: 100vh; width: 100vw; }

    .header-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #f8fafc;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      max-width: 410px;
    }
    .header-panel h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 10px #10b981;
    }
    .header-panel p {
      margin: 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
    }
    .stat-item {
      background: rgba(30, 41, 59, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(51, 65, 85, 0.4);
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: #10b981;
      margin-top: 2px;
    }



    .legend-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #f8fafc;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 270px;
    }
    .legend-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .legend-bar {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #86efac, #34d399, #10b981, #059669, #047857, #f59e0b);
      margin-bottom: 6px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-family: monospace;
      font-size: 10px;
    }

    .maplibregl-popup-content {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
      border-radius: 10px !important;
      padding: 12px 14px !important;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5) !important;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #0f172a !important; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #0f172a !important; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #0f172a !important; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #0f172a !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="header-panel">
    <h1><span class="pulse-dot"></span> Lake District Carbon Map</h1>
    <p>Every 20m woodland canopy square across all 174 tiles (862,439 vector cells) streamed via PMTiles.</p>
    
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Total Stored Carbon</div>
        <div class="stat-val">1,483,238 <span style="font-size:11px; font-weight:normal;">tC</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">CO₂ Equivalent</div>
        <div class="stat-val" style="color:#2dd4bf;">5,438,540 <span style="font-size:11px; font-weight:normal;">tCO₂e</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Forest Canopy Area</div>
        <div class="stat-val" style="color:#38bdf8;">34,498 <span style="font-size:11px; font-weight:normal;">ha</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Mean Carbon Density</div>
        <div class="stat-val" style="color:#fbbf24;">43.0 <span style="font-size:11px; font-weight:normal;">tC/ha</span></div>
      </div>
    </div>


  </div>

  <div class="legend-panel">
    <div class="legend-title">
      <span>Carbon Density</span>
      <span style="color:#34d399;">tC / ha</span>
    </div>
    <div class="legend-bar"></div>
    <div class="legend-labels">
      <span>0.1</span>
      <span>30</span>
      <span>60</span>
      <span>90</span>
      <span>120</span>
      <span>150+</span>
    </div>
  </div>

  <script>
    // Register PMTiles v3 Protocol
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: '&copy; Esri, Maxar, Earthstar Geographics'
          },
          'carbon_source': {
            type: 'vector',
            url: 'pmtiles://lake_district_carbon.pmtiles'
          }
        },
        layers: [
          {
            id: 'satellite-bg',
            type: 'raster',
            source: 'satellite'
          },
          {
            id: 'carbon-squares-fill',
            type: 'fill',
            source: 'carbon_source',
            'source-layer': 'carbon_cells',
            paint: {
              'fill-color': [
                'interpolate',
                ['linear'],
                ['get', 'density'],
                0, '#86efac',
                30, '#34d399',
                60, '#10b981',
                90, '#059669',
                120, '#047857',
                150, '#f59e0b'
              ],
              'fill-opacity': 0.85
            }
          },
          {
            id: 'carbon-squares-border',
            type: 'line',
            source: 'carbon_source',
            'source-layer': 'carbon_cells',
            paint: {
              'line-color': '#064e3b',
              'line-width': 0.5,
              'line-opacity': 0.5
            }
          }
        ]
      },
      center: [-3.12, 54.48],
      zoom: 10,
      maxZoom: 17,
      minZoom: 8
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');



    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false
    });

    map.on('mousemove', 'carbon-squares-fill', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      if (e.features.length > 0) {
        const p = e.features[0].properties;
        popup.setLngLat(e.lngLat)
          .setHTML(`
            <div style="min-width: 200px;">
              <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #334155; padding-bottom: 4px; margin-bottom: 6px;">
                <strong style="color: #34d399; font-size: 13px;">${p.type}</strong>
                <span style="background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-family: monospace; color: #94a3b8;">20m square</span>
              </div>
              <div style="font-size: 12px; line-height: 1.6; color: #cbd5e1;">
                <div><strong>Carbon Density:</strong> <span style="color:#f59e0b; font-weight:bold;">${p.density} tC/ha</span></div>
                <div><strong>Cell Stored Carbon:</strong> <span style="color:#34d399; font-weight:bold;">${p.c} tC</span></div>
                <div><strong>CO₂ Equivalent:</strong> <span style="color:#2dd4bf;">${p.co2e} tCO₂e</span></div>
                <div><strong>Canopy Height (h90):</strong> ${p.h90} m</div>
                <div><strong>Timber Volume:</strong> ${p.vol} m³/ha</div>
              </div>
            </div>
          `)
          .addTo(map);
      }
    });

    map.on('mouseleave', 'carbon-squares-fill', () => {
      map.getCanvas().style.cursor = '';
      popup.remove();
    });
  </script>
</body>
</html>
