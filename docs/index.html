<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake District Carbon Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
      background: #0f172a;
      overflow: hidden;
    }
    #map { height: 100vh; width: 100vw; }

    .header-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(71, 85, 105, 0.75);
      color: #f8fafc;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      width: 360px;
      max-width: calc(100vw - 32px);
    }
    .header-panel h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .tab-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .tab-btn:hover {
      background: #334155;
      color: #f8fafc;
    }
    .tab-btn.active {
      background: #10b981;
      color: #0f172a;
      border-color: #10b981;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .stat-item {
      background: rgba(30, 41, 59, 0.65);
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid rgba(51, 65, 85, 0.6);
      overflow: hidden;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: #10b981;
      line-height: 1.25;
    }
    .stat-unit {
      font-size: 11px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .controls-container {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: #cbd5e1;
      user-select: none;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider.slider-amber { background-color: #f59e0b; }
    input:checked + .slider.slider-blue { background-color: #38bdf8; }
    input:checked + .slider:before { transform: translateX(16px); }

    .legend-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(71, 85, 105, 0.8);
      color: #f8fafc;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      width: 280px;
      max-width: calc(100vw - 48px);
    }
    .legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .legend-bar-delta {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #dc2626 0%, #ef4444 22%, #fca5a5 40%, rgba(148, 163, 184, 0.75) 48%, rgba(148, 163, 184, 0.75) 52%, #86efac 62%, #10b981 80%, #064e3b 100%);
      margin-bottom: 6px;
    }
    .legend-bar-density {
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #d9f99d, #86efac, #34d399, #10b981, #059669, #064e3b);
      margin-bottom: 6px;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
    }

    .maplibregl-popup,
    .maplibregl-popup-content,
    .maplibregl-popup-tip {
      pointer-events: none !important;
    }
    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.97) !important;
      color: #f8fafc !important;
      border: 1px solid #475569 !important;
      border-radius: 10px !important;
      padding: 11px 13px !important;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.7) !important;
      width: 245px !important;
      max-width: 245px !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif !important;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(15, 23, 42, 0.97) !important; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.97) !important; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: rgba(15, 23, 42, 0.97) !important; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: rgba(15, 23, 42, 0.97) !important; }

    .popup-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
      margin-bottom: 7px;
    }
    .popup-title {
      color: #38bdf8;
      font-size: 12.5px;
      font-weight: 700;
    }
    .badge-felled {
      background: rgba(220, 38, 38, 0.25);
      color: #fca5a5;
      border: 1px solid #ef4444;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 700;
    }
    .badge-loss {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid #f87171;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 700;
    }
    .badge-gain {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid #10b981;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 700;
    }
    .badge-stable {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="header-panel">
    <h1>Lake District Carbon Map</h1>

    <div class="mode-tabs">
      <button id="btn-delta" class="tab-btn active" onclick="setMode('delta')">2009 vs 2020</button>
      <button id="btn-t2" class="tab-btn" onclick="setMode('t2')">2020</button>
      <button id="btn-t1" class="tab-btn" onclick="setMode('t1')">2009</button>
    </div>

    <div id="metrics-panel" class="stats-grid">
      <div class="stat-item">
        <div id="label-stat-1" class="stat-label">Net Carbon Change</div>
        <div id="val-stat-1" class="stat-val" style="color: #34d399;">+144,876 <span class="stat-unit">tC</span></div>
      </div>
      <div class="stat-item">
        <div id="label-stat-2" class="stat-label">CO₂ Equivalent</div>
        <div id="val-stat-2" class="stat-val" style="color: #2dd4bf;">+531,212 <span class="stat-unit">tCO₂e</span></div>
      </div>
      <div class="stat-item">
        <div id="label-stat-3" class="stat-label">Growth / Loss</div>
        <div id="val-stat-3" class="stat-val" style="font-size: 13px;">
          <span style="color:#34d399;">+8,888 ha</span> / <span style="color:#f87171;">-1,673 ha</span>
        </div>
      </div>
      <div class="stat-item">
        <div id="label-stat-4" class="stat-label">Clear-Felled</div>
        <div id="val-stat-4" class="stat-val" style="color: #f87171;">708.6 <span class="stat-unit">ha</span></div>
      </div>
    </div>

    <div class="controls-container">
      <div class="control-row" id="row-unflown-toggle">
        <label class="switch">
          <input type="checkbox" id="toggle-only20" onchange="updateMapFiltersAndPaint()">
          <span class="slider slider-blue"></span>
        </label>
        <span>Show 2020-only areas</span>
      </div>
      <div class="control-row">
        <label class="switch">
          <input type="checkbox" id="toggle-squares" checked onchange="toggleLayer('carbon', this.checked)">
          <span class="slider"></span>
        </label>
        <span>20m Carbon Grid</span>
      </div>
      <div class="control-row">
        <label class="switch">
          <input type="checkbox" id="toggle-boundary" checked onchange="toggleLayer('boundary', this.checked)">
          <span class="slider slider-amber"></span>
        </label>
        <span>National Park Boundary</span>
      </div>
    </div>
  </div>

  <div class="legend-panel">
    <div id="legend-header" class="legend-title">
      <span id="legend-title-text">Carbon Change</span>
      <span id="legend-unit-text" style="color:#34d399;">Δ tC / ha</span>
    </div>
    <div id="legend-bar" class="legend-bar-delta"></div>
    <div id="legend-labels" class="legend-labels">
      <span style="color:#f87171;">-35</span>
      <span style="color:#94a3b8;">0</span>
      <span style="color:#34d399;">+35+</span>
    </div>
  </div>

  <script>
    let currentMode = 'delta';

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const MODE_CONFIG = {
      delta: {
        stat1_label: 'Net Carbon Change',
        stat1_val: '+144,876 <span class="stat-unit">tC</span>',
        stat1_color: '#34d399',
        stat2_label: 'CO₂ Equivalent',
        stat2_val: '+531,212 <span class="stat-unit">tCO₂e</span>',
        stat3_label: 'Growth / Loss',
        stat3_val: '<span style="color:#34d399;">+8,888 ha</span> / <span style="color:#f87171;">-1,673 ha</span>',
        stat4_label: 'Clear-Felled',
        stat4_val: '<span style="color:#f87171;">708.6 <span class="stat-unit">ha</span></span>'
      },
      t2: {
        stat1_label: '2020 Stored Carbon',
        stat1_val: '947,837 <span class="stat-unit">tC</span>',
        stat1_color: '#34d399',
        stat2_label: 'CO₂ Equivalent',
        stat2_val: '3,475,720 <span class="stat-unit">tCO₂e</span>',
        stat3_label: 'Woodland Area',
        stat3_val: '<span style="color:#38bdf8;">26,391 <span class="stat-unit">ha</span></span>',
        stat4_label: 'Mean Density',
        stat4_val: '<span style="color:#10b981;">35.9 <span class="stat-unit">tC/ha</span></span>'
      },
      t1: {
        stat1_label: '2009 Stored Carbon',
        stat1_val: '226,008 <span class="stat-unit">tC</span>',
        stat1_color: '#34d399',
        stat2_label: 'CO₂ Equivalent',
        stat2_val: '828,697 <span class="stat-unit">tCO₂e</span>',
        stat3_label: 'Surveyed Area',
        stat3_val: '<span style="color:#38bdf8;">9,074 <span class="stat-unit">ha</span></span>',
        stat4_label: 'Mean Density',
        stat4_val: '<span style="color:#10b981;">24.9 <span class="stat-unit">tC/ha</span></span>'
      }
    };

    function getLayerFilter(mode, showOnly20InDelta) {
      if (mode === 'delta') {
        return showOnly20InDelta ? null : ['!=', ['get', 'st'], 'only20'];
      } else if (mode === 't2') {
        return ['>', ['coalesce', ['get', 'd20'], 0], 0];
      } else if (mode === 't1') {
        return ['>', ['coalesce', ['get', 'd09'], 0], 0];
      }
      return null;
    }

    function getPaintExpression(mode) {
      if (mode === 'delta') {
        return [
          'case',
          ['==', ['get', 'st'], 'only20'],
          'rgba(100, 116, 139, 0.35)',
          [
            'interpolate',
            ['linear'],
            ['coalesce', ['get', 'dd'], 0],
            -35, '#dc2626',
            -15, '#ef4444',
            -3,  '#fca5a5',
            0,   'rgba(148, 163, 184, 0.5)',
            3,   '#86efac',
            18,  '#10b981',
            35,  '#064e3b'
          ]
        ];
      } else {
        const prop = (mode === 't2') ? 'd20' : 'd09';
        return [
          'interpolate',
          ['linear'],
          ['coalesce', ['get', prop], 0],
          0,   '#d9f99d',
          25,  '#86efac',
          50,  '#34d399',
          75,  '#10b981',
          100, '#059669',
          130, '#064e3b'
        ];
      }
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'satellite': {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: '&copy; Esri, Maxar, Earthstar Geographics'
          },
          'boundary_source': {
            type: 'geojson',
            data: 'lake_district_boundary.geojson'
          },
          'carbon_source': {
            type: 'vector',
            url: 'pmtiles://lake_district_carbon.pmtiles'
          }
        },
        layers: [
          {
            id: 'satellite-bg',
            type: 'raster',
            source: 'satellite'
          },
          {
            id: 'carbon-squares-fill',
            type: 'fill',
            source: 'carbon_source',
            'source-layer': 'carbon_temporal',
            filter: ['!=', ['get', 'st'], 'only20'],
            paint: {
              'fill-color': getPaintExpression('delta'),
              'fill-opacity': 0.85
            }
          },
          {
            id: 'carbon-squares-border',
            type: 'line',
            source: 'carbon_source',
            'source-layer': 'carbon_temporal',
            filter: ['!=', ['get', 'st'], 'only20'],
            paint: {
              'line-color': 'rgba(15, 23, 42, 0.35)',
              'line-width': 0.4
            }
          },
          {
            id: 'ldnp-boundary-line',
            type: 'line',
            source: 'boundary_source',
            paint: {
              'line-color': '#f59e0b',
              'line-width': 2.5,
              'line-dasharray': [4, 2]
            }
          }
        ]
      },
      center: [-3.08, 54.47],
      zoom: 10,
      maxZoom: 17,
      minZoom: 8
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 100, unit: 'metric' }), 'bottom-left');

    function updateMapFiltersAndPaint() {
      const showOnly20 = document.getElementById('toggle-only20').checked;
      const filterExpr = getLayerFilter(currentMode, showOnly20);
      const paintExpr = getPaintExpression(currentMode);

      if (map.getLayer('carbon-squares-fill')) {
        map.setFilter('carbon-squares-fill', filterExpr);
        map.setPaintProperty('carbon-squares-fill', 'fill-color', paintExpr);
      }
      if (map.getLayer('carbon-squares-border')) {
        map.setFilter('carbon-squares-border', filterExpr);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-delta').classList.toggle('active', mode === 'delta');
      document.getElementById('btn-t2').classList.toggle('active', mode === 't2');
      document.getElementById('btn-t1').classList.toggle('active', mode === 't1');

      document.getElementById('row-unflown-toggle').style.display = (mode === 'delta') ? 'flex' : 'none';

      const cfg = MODE_CONFIG[mode];
      const bar = document.getElementById('legend-bar');
      const lTitle = document.getElementById('legend-title-text');
      const lUnit = document.getElementById('legend-unit-text');
      const lLabels = document.getElementById('legend-labels');

      if (mode === 'delta') {
        bar.className = 'legend-bar-delta';
        lTitle.innerText = 'Carbon Change';
        lUnit.innerText = 'Δ tC / ha';
        lUnit.style.color = '#34d399';
        lLabels.innerHTML = '<span style="color:#f87171;">-35</span><span style="color:#94a3b8;">0</span><span style="color:#34d399;">+35+</span>';
      } else {
        bar.className = 'legend-bar-density';
        lTitle.innerText = (mode === 't2') ? '2020 Carbon Density' : '2009 Carbon Density';
        lUnit.innerText = 'tC / ha';
        lUnit.style.color = '#34d399';
        lLabels.innerHTML = '<span>0</span><span>25</span><span>50</span><span>75</span><span>100</span><span>130+</span>';
      }

      document.getElementById('label-stat-1').innerText = cfg.stat1_label;
      document.getElementById('val-stat-1').innerHTML = cfg.stat1_val;
      document.getElementById('val-stat-1').style.color = cfg.stat1_color;

      document.getElementById('label-stat-2').innerText = cfg.stat2_label;
      document.getElementById('val-stat-2').innerHTML = cfg.stat2_val;

      document.getElementById('label-stat-3').innerText = cfg.stat3_label;
      document.getElementById('val-stat-3').innerHTML = cfg.stat3_val;

      document.getElementById('label-stat-4').innerText = cfg.stat4_label;
      document.getElementById('val-stat-4').innerHTML = cfg.stat4_val;

      updateMapFiltersAndPaint();
    }

    function toggleLayer(type, visible) {
      const val = visible ? 'visible' : 'none';
      if (type === 'carbon') {
        if (map.getLayer('carbon-squares-fill')) map.setLayoutProperty('carbon-squares-fill', 'visibility', val);
        if (map.getLayer('carbon-squares-border')) map.setLayoutProperty('carbon-squares-border', 'visibility', val);
      } else if (type === 'boundary') {
        if (map.getLayer('ldnp-boundary-line')) map.setLayoutProperty('ldnp-boundary-line', 'visibility', val);
      }
    }

    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false,
      offset: 14
    });

    map.on('mousemove', (e) => {
      if (!map.getLayer('carbon-squares-fill')) return;
      const vis = map.getLayoutProperty('carbon-squares-fill', 'visibility');
      if (vis === 'none') {
        popup.remove();
        map.getCanvas().style.cursor = '';
        return;
      }

      const bbox = [
        [e.point.x - 2, e.point.y - 2],
        [e.point.x + 2, e.point.y + 2]
      ];
      const features = map.queryRenderedFeatures(bbox, { layers: ['carbon-squares-fill'] });

      if (!features || features.length === 0) {
        popup.remove();
        map.getCanvas().style.cursor = '';
        return;
      }

      map.getCanvas().style.cursor = 'pointer';
      const p = features[0].properties;
      const st = p.st || 'stable';
      const has09 = p.d09 !== undefined && p.d09 !== null;
      const d09 = has09 ? parseFloat(p.d09) : 0;
      const d20 = p.d20 !== undefined ? parseFloat(p.d20) : 0;
      const h09 = p.h09 !== undefined ? parseFloat(p.h09) : 0;
      const h20 = p.h20 !== undefined ? parseFloat(p.h20) : 0;
      const dd  = p.dd  !== undefined ? parseFloat(p.dd)  : (d20 - d09);
      const dh  = p.dh  !== undefined ? parseFloat(p.dh)  : (h20 - h09);

      let badgeHtml = '';
      let deltaColor = '#34d399';

      if (st === 'only20') {
        badgeHtml = `<span class="badge-stable">2020 ONLY</span>`;
        deltaColor = '#94a3b8';
      } else if (st === 'felled' || (d20 <= 0.1 && d09 >= 2.0)) {
        badgeHtml = `<span class="badge-felled">FELLED</span>`;
        deltaColor = '#f87171';
      } else if (dd < -1.5) {
        badgeHtml = `<span class="badge-loss">LOSS</span>`;
        deltaColor = '#f87171';
      } else if (dd > 1.5) {
        badgeHtml = `<span class="badge-gain">GROWTH</span>`;
        deltaColor = '#34d399';
      } else {
        badgeHtml = `<span class="badge-stable">STABLE</span>`;
        deltaColor = '#94a3b8';
      }

      let bodyHtml = '';
      if (st === 'only20') {
        bodyHtml = `
          <div style="font-size: 12px; line-height: 1.6; color: #cbd5e1;">
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#94a3b8;">2020 Carbon:</span>
              <strong style="color:#34d399;">${d20.toFixed(1)} tC/ha</strong>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#94a3b8;">2020 Height:</span>
              <strong style="color:#f8fafc;">${h20.toFixed(1)} m</strong>
            </div>
          </div>
        `;
      } else {
        const sign = dd > 0 ? '+' : '';
        const hSign = dh > 0 ? '+' : '';

        bodyHtml = `
          <div style="font-size: 12px; line-height: 1.6; color: #cbd5e1;">
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#94a3b8;">Change:</span>
              <strong style="color:${deltaColor};">${sign}${dd.toFixed(1)} tC/ha (${hSign}${dh.toFixed(1)} m)</strong>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#94a3b8;">2009:</span>
              <strong style="color:#f8fafc;">${d09.toFixed(1)} tC/ha (${h09.toFixed(1)} m)</strong>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#94a3b8;">2020:</span>
              <strong style="color:${d20 === 0 ? '#f87171' : '#f8fafc'};">${d20.toFixed(1)} tC/ha (${h20.toFixed(1)} m)</strong>
            </div>
          </div>
        `;
      }

      popup.setLngLat(e.lngLat)
        .setHTML(`
          <div>
            <div class="popup-header">
              <span class="popup-title">${p.type || 'Woodland'}</span>
              ${badgeHtml}
            </div>
            ${bodyHtml}
          </div>
        `)
        .addTo(map);
    });
  </script>
</body>
</html>
